<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JARVIS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#bffaff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 48%, rgba(0,177,255,.25) 0%, rgba(0,60,95,.13) 30%, transparent 55%),
    radial-gradient(circle at center,#061a29 0%,#020810 50%,#000 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(46,218,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(46,218,255,.045) 1px,transparent 1px);
  background-size:34px 34px;
}

body::after{
  content:"";
  position:fixed;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(89,235,255,.6),
    transparent
  );
  box-shadow:0 0 9px rgba(73,222,255,.5);
  animation:scan 7s linear infinite;
  pointer-events:none;
}

@keyframes scan{
  from{top:0}
  to{top:100%}
}

.app{
  position:relative;
  width:100%;
  height:100%;
  padding:
    calc(14px + env(safe-area-inset-top))
    16px
    calc(14px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}

.header{
  height:76px;
  border-top:1px solid rgba(77,225,255,.4);
  border-bottom:1px solid rgba(77,225,255,.4);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(0,79,110,.16),
    transparent
  );
}

.title{
  color:#d8ffff;
  font-size:24px;
  letter-spacing:.48em;
  margin-left:.48em;
  text-shadow:
    0 0 8px #57eaff,
    0 0 20px #11bfff;
}

.subtitle{
  margin-top:6px;
  color:#61c9da;
  font-size:9px;
  letter-spacing:.23em;
}

.center{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.hud{
  width:min(78vw,390px);
  height:min(78vw,390px);
  position:relative;
  border-radius:50%;
  filter:drop-shadow(0 0 10px rgba(0,200,255,.25));
}

.ring1{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px dashed rgba(88,232,255,.55);
  animation:spin 22s linear infinite;
}

.ring2{
  position:absolute;
  inset:8%;
  border-radius:50%;
  border:1px solid rgba(89,230,255,.48);
  border-left-color:transparent;
  border-right-color:transparent;
  animation:reverseSpin 11s linear infinite;
}

.ring3{
  position:absolute;
  inset:18%;
  border-radius:50%;
  border:3px solid rgba(108,240,255,.72);
  border-top-color:transparent;
  border-bottom-color:transparent;
  animation:spin 7s linear infinite;
}

.ring4{
  position:absolute;
  inset:30%;
  border-radius:50%;
  border:2px solid rgba(102,238,255,.5);
  animation:reverseSpin 4s linear infinite;
}

.ticks{
  position:absolute;
  inset:5%;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      rgba(100,235,255,.65) 0deg .7deg,
      transparent .8deg 5deg
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 47%,
      black 48% 49%,
      transparent 50%
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 47%,
      black 48% 49%,
      transparent 50%
    );

  animation:spin 32s linear infinite;
}

.core{
  position:absolute;
  inset:39%;
  border-radius:50%;
  background:#e1ffff;
  box-shadow:
    0 0 10px 4px #a2ffff,
    0 0 25px 12px #30eaff,
    0 0 70px 25px rgba(0,181,255,.65);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes reverseSpin{
  to{transform:rotate(-360deg)}
}

@keyframes pulse{
  50%{
    transform:scale(1.22);
  }
}

.listening .core{
  animation:pulse .65s ease-in-out infinite;
  box-shadow:
    0 0 12px 5px white,
    0 0 30px 14px #50efff,
    0 0 100px 35px rgba(0,200,255,.9);
}

.speaking .core{
  animation:pulse .32s ease-in-out infinite;
}

.status{
  position:absolute;
  bottom:7%;
  left:0;
  right:0;
  text-align:center;
  color:#6cd9ea;
  font-size:11px;
  letter-spacing:.22em;
}

.clock{
  margin-top:6px;
  font-size:15px;
  color:#c9fbff;
}

.bottom{
  min-height:100px;
  border:1px solid rgba(71,219,255,.28);
  background:rgba(0,20,31,.55);
  padding:12px 14px;
}

.label{
  color:#46d9ef;
  font-size:9px;
  letter-spacing:.18em;
  margin-bottom:7px;
}

.transcript{
  color:#c8f7ff;
  font-size:13px;
  line-height:1.4;
  min-height:20px;
}

.tip{
  margin-top:8px;
  font-size:10px;
  color:#558c99;
  letter-spacing:.08em;
}

.activation{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#06273a 0%,#01070d 60%,#000 100%);
}

.activationBox{
  width:82%;
  max-width:420px;
  padding:34px 22px;
  text-align:center;
  border:1px solid rgba(90,233,255,.48);
  background:rgba(0,18,29,.78);
  box-shadow:
    0 0 35px rgba(0,190,255,.12);
}

.activationTitle{
  font-size:25px;
  letter-spacing:.35em;
  margin-left:.35em;
  color:#caffff;
  text-shadow:0 0 15px #2adfff;
}

.activationText{
  margin-top:22px;
  color:#72dceb;
  font-size:13px;
  line-height:1.55;
}

.activationHint{
  margin-top:26px;
  color:white;
  font-size:12px;
  letter-spacing:.2em;
  animation:fade 1.5s ease-in-out infinite;
}

@keyframes fade{
  50%{opacity:.35}
}
</style>
</head>

<body>

<div id="activation" class="activation">
  <div class="activationBox">
    <div class="activationTitle">J.A.R.V.I.S.</div>

    <div class="activationText">
      Personal intelligence interface standing by.
    </div>

    <div class="activationHint">
      TAP TO INITIALIZE
    </div>
  </div>
</div>


<div id="app" class="app">

  <div class="header">

    <div class="title">
      J.A.R.V.I.S.
    </div>

    <div class="subtitle">
      PERSONAL INTELLIGENCE SYSTEM
    </div>

  </div>


  <div class="center">

    <div class="hud">

      <div class="ticks"></div>

      <div class="ring1"></div>

      <div class="ring2"></div>

      <div class="ring3"></div>

      <div class="ring4"></div>

      <div class="core"></div>

    </div>


    <div class="status">

      <div id="status">
        SYSTEM STANDBY
      </div>

      <div id="clock" class="clock">
        --:--
      </div>

    </div>

  </div>


  <div class="bottom">

    <div class="label">
      VOICE INTERFACE
    </div>

    <div id="transcript" class="transcript">
      Awaiting initialization.
    </div>

    <div class="tip">
      After activation, tap anywhere on the HUD to speak.
    </div>

  </div>

</div>


<script>

const app =
document.getElementById("app");

const activation =
document.getElementById("activation");

const statusText =
document.getElementById("status");

const transcript =
document.getElementById("transcript");

let recognition = null;

let currentlyListening = false;

let initialized = false;


/* ---------------- CLOCK ---------------- */

function updateClock(){

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString(
      [],
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}

updateClock();

setInterval(
  updateClock,
  1000
);


/* ---------------- SIR ---------------- */

function addSir(text){

  let clean =
    text.trim();

  clean =
    clean.replace(
      /[.!?]+$/,
      ""
    );

  if(
    clean.toLowerCase().endsWith("sir")
  ){
    return clean + ".";
  }

  return clean + ", sir.";

}


/* ---------------- VOICE ---------------- */

function chooseVoice(){

  const voices =
    speechSynthesis.getVoices();

  let voice =

    voices.find(
      v =>
      /Daniel/i.test(v.name)
    )

    ||

    voices.find(
      v =>
      /British/i.test(v.name)
    )

    ||

    voices.find(
      v =>
      v.lang === "en-GB"
    )

    ||

    voices.find(
      v =>
      /UK/i.test(v.name)
    )

    ||

    voices.find(
      v =>
      v.lang.startsWith("en")
    );

  return voice;

}


function speak(originalText){

  if(
    !("speechSynthesis" in window)
  ){

    transcript.textContent =
      originalText;

    return;
  }

  const text =
    addSir(originalText);

  transcript.textContent =
    text;

  statusText.textContent =
    "RESPONDING";

  app.classList.remove(
    "listening"
  );

  app.classList.add(
    "speaking"
  );

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(
      text
    );

  const voice =
    chooseVoice();

  if(voice){
    speech.voice = voice;
  }

  /*
    Lower rate + slightly lower pitch
    gives a calmer polished AI voice.
  */

  speech.rate = 0.88;

  speech.pitch = 0.72;

  speech.volume = 1;


  speech.onend = function(){

    app.classList.remove(
      "speaking"
    );

    statusText.textContent =
      "AWAITING COMMAND";

  };


  speech.onerror = function(){

    app.classList.remove(
      "speaking"
    );

    statusText.textContent =
      "VOICE OUTPUT ERROR";

  };


  speechSynthesis.speak(
    speech
  );

}


/*
iPhones can load the voice list
after the webpage opens.
*/

if(
  "speechSynthesis" in window
){

  speechSynthesis.getVoices();

  speechSynthesis.onvoiceschanged =
  function(){

    speechSynthesis.getVoices();

  };

}


/* ---------------- WEATHER ---------------- */

async function weatherForCity(city){

  statusText.textContent =
    "ACCESSING WEATHER DATA";

  try{

    const geoRequest =
      await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(city) +
        "&count=1&language=en&format=json"
      );

    const geo =
      await geoRequest.json();

    if(
      !geo.results ||
      !geo.results.length
    ){

      speak(
        "I was unable to locate " +
        city
      );

      return;
    }

    const place =
      geo.results[0];

    getWeather(
      place.latitude,
      place.longitude,
      place.name
    );

  }

  catch(error){

    speak(
      "I am unable to access weather information at the moment"
    );

  }

}


async function getWeather(
  latitude,
  longitude,
  locationName
){

  try{

    const request =
      await fetch(
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&temperature_unit=fahrenheit" +
        "&wind_speed_unit=mph" +
        "&timezone=auto"
      );

    const data =
      await request.json();

    const current =
      data.current;

    const temperature =
      Math.round(
        current.temperature_2m
      );

    const feels =
      Math.round(
        current.apparent_temperature
      );

    const wind =
      Math.round(
        current.wind_speed_10m
      );

    speak(
      "The current temperature in " +
      locationName +
      " is " +
      temperature +
      " degrees Fahrenheit. It feels like " +
      feels +
      " degrees, with winds around " +
      wind +
      " miles per hour"
    );

  }

  catch(error){

    speak(
      "Weather information is currently unavailable"
    );

  }

}


function localWeather(){

  if(
    !navigator.geolocation
  ){

    speak(
      "Location services are unavailable. Tell me a city instead"
    );

    return;
  }

  statusText.textContent =
    "LOCATING";

  navigator.geolocation.getCurrentPosition(

    function(position){

      getWeather(
        position.coords.latitude,
        position.coords.longitude,
        "your location"
      );

    },

    function(){

      speak(
        "Location permission was not granted. You may ask for weather in a specific city"
      );

    },

    {
      enableHighAccuracy:false,
      timeout:8000,
      maximumAge:300000
    }

  );

}


/* ---------------- COMMANDS ---------------- */

function processCommand(text){

  transcript.textContent =
    "YOU: " + text;

  const command =
    text
    .toLowerCase()
    .trim();


  /* HELLO */

  if(
    command.includes(
      "hello"
    )

    ||

    command.includes(
      "hey jarvis"
    )

    ||

    command === "jarvis"
  ){

    speak(
      "At your service"
    );

    return;

  }


  /* TIME */

  if(
    command.includes(
      "what time"
    )

    ||

    command.includes(
      "current time"
    )

    ||

    command === "time"
  ){

    const time =
      new Date()
      .toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

    speak(
      "The time is " +
      time
    );

    return;

  }


  /* DATE */

  if(
    command.includes(
      "what day"
    )

    ||

    command.includes(
      "what date"
    )

    ||

    command.includes(
      "today's date"
    )

    ||

    command.includes(
      "todays date"
    )
  ){

    const date =
      new Date()
      .toLocaleDateString(
        [],
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );

    speak(
      "Today is " +
      date
    );

    return;

  }


  /* WEATHER */

  if(
    command.includes(
      "weather"
    )

    ||

    command.includes(
      "temperature"
    )
  ){

    const cityMatch =
      text.match(
        /(?:weather|temperature)(?:\s+(?:in|for|at))\s+(.+)/i
      );

    if(
      cityMatch
    ){

      weatherForCity(
        cityMatch[1]
      );

    }

    else{

      localWeather();

    }

    return;

  }


  /* SYSTEM STATUS */

  if(
    command.includes(
      "system status"
    )

    ||

    command.includes(
      "status report"
    )

    ||

    command === "status"
  ){

    speak(
      "All primary systems are online and functioning normally"
    );

    return;

  }


  /* HOW ARE YOU */

  if(
    command.includes(
      "how are you"
    )
  ){

    speak(
      "All systems are functioning perfectly. Thank you for asking"
    );

    return;

  }


  /* WHO ARE YOU */

  if(
    command.includes(
      "who are you"
    )
  ){

    speak(
      "I am JARVIS, your personal intelligence interface"
    );

    return;

  }


  /* THANK YOU */

  if(
    command.includes(
      "thank you"
    )

    ||

    command.includes(
      "thanks"
    )
  ){

    speak(
      "Always a pleasure"
    );

    return;

  }


  /* GOODBYE */

  if(
    command.includes(
      "goodbye"
    )

    ||

    command.includes(
      "shut down"
    )
  ){

    speak(
      "Very good. I will remain on standby"
    );

    return;

  }


  /*
  Open-ended AI will be connected later.
  */

  speak(
    "I do not have that intelligence module installed yet"
  );

}


/* ---------------- MICROPHONE ---------------- */

function setupRecognition(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(
    !SpeechRecognition
  ){

    statusText.textContent =
      "VOICE INPUT UNAVAILABLE";

    transcript.textContent =
      "Voice recognition is not supported in this browser.";

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-US";


  recognition.interimResults =
    false;


  recognition.continuous =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
  function(){

    currentlyListening =
      true;

    statusText.textContent =
      "LISTENING";

    transcript.textContent =
      "Listening...";

    app.classList.add(
      "listening"
    );

    app.classList.remove(
      "speaking"
    );

  };


  recognition.onresult =
  function(event){

    const text =
      event
      .results[0][0]
      .transcript;

    processCommand(
      text
    );

  };


  recognition.onerror =
  function(event){

    app.classList.remove(
      "listening"
    );

    currentlyListening =
      false;


    if(
      event.error ===
      "not-allowed"
    ){

      statusText.textContent =
        "MICROPHONE PERMISSION REQUIRED";

      transcript.textContent =
        "Allow microphone access in Safari settings.";

      return;

    }


    if(
      event.error ===
      "no-speech"
    ){

      statusText.textContent =
        "AWAITING COMMAND";

      transcript.textContent =
        "I didn't hear anything. Tap the HUD and try again.";

      return;

    }


    statusText.textContent =
      "VOICE INPUT ERROR";

  };


  recognition.onend =
  function(){

    currentlyListening =
      false;

    app.classList.remove(
      "listening"
    );

    if(
      !speechSynthesis.speaking
    ){

      statusText.textContent =
        "AWAITING COMMAND";

    }

  };

}


/* ---------------- LISTEN ---------------- */

function startListening(){

  if(
    !initialized
  ){
    return;
  }


  if(
    !recognition
  ){

    setupRecognition();

  }


  if(
    !recognition ||
    currentlyListening ||
    speechSynthesis.speaking
  ){
    return;
  }


  try{

    recognition.start();

  }

  catch(error){}

}


/* ---------------- ACTIVATE ---------------- */

activation.addEventListener(
  "click",
  function(){

    initialized =
      true;

    activation.style.display =
      "none";


    /*
    This first empty speech helps
    unlock audio on iPhone Safari.
    */

    if(
      "speechSynthesis" in window
    ){

      speechSynthesis.cancel();

      const unlock =
        new SpeechSynthesisUtterance(
          ""
        );

      speechSynthesis.speak(
        unlock
      );

    }


    setupRecognition();


    setTimeout(
      function(){

        speak(
          "JARVIS online. All systems standing by"
        );

      },
      250
    );

  }
);


/*
Once JARVIS is activated,
tap anywhere on the main interface
to start speaking.
*/

app.addEventListener(
  "click",
  function(){

    startListening();

  }
);

</script>

</body>
</html>
