<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JARVIS</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at center, #05253a 0%, #020b14 45%, #000 100%);
  color:#9ff6ff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,220,255,.05) 1px, transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.05) 1px,transparent 1px);
  background-size:30px 30px;
}

.app{
  min-height:100vh;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.top{
  border:1px solid rgba(90,235,255,.45);
  padding:16px;
  text-align:center;
  background:rgba(0,20,32,.72);
  box-shadow:0 0 25px rgba(0,200,255,.12);
}

h1{
  margin:0;
  letter-spacing:.42em;
  color:#b9fbff;
  text-shadow:0 0 15px #00cfff;
}

.subtitle{
  margin-top:6px;
  font-size:10px;
  letter-spacing:.18em;
  opacity:.65;
}

.hud{
  width:240px;
  height:240px;
  margin:20px auto;
  position:relative;
  border-radius:50%;
  border:2px dashed #44eaff;
  animation:spin 18s linear infinite;
  box-shadow:
    0 0 30px rgba(0,220,255,.18),
    inset 0 0 40px rgba(0,220,255,.09);
}

.hud:before{
  content:"";
  position:absolute;
  inset:24px;
  border-radius:50%;
  border:4px solid rgba(70,235,255,.7);
  border-left-color:transparent;
  border-right-color:transparent;
  animation:reverseSpin 7s linear infinite;
}

.hud:after{
  content:"";
  position:absolute;
  inset:75px;
  border-radius:50%;
  background:#bfffff;
  box-shadow:
    0 0 15px 7px #42eaff,
    0 0 60px 20px rgba(0,180,255,.65);
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes reverseSpin{
  to{transform:rotate(-360deg)}
}

.status{
  text-align:center;
  font-size:12px;
  letter-spacing:.15em;
  margin-bottom:10px;
}

.chat{
  flex:1;
  min-height:240px;
  max-height:340px;
  overflow-y:auto;
  border:1px solid rgba(90,235,255,.35);
  background:rgba(0,20,32,.72);
  padding:14px;
}

.message{
  padding:10px;
  margin-bottom:9px;
  border-left:3px solid #21cce8;
  background:rgba(0,130,170,.08);
  line-height:1.4;
}

.message b{
  display:block;
  font-size:10px;
  letter-spacing:.15em;
  color:#52eaff;
  margin-bottom:4px;
}

.controls{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:8px;
}

input{
  background:#02131e;
  border:1px solid #36d9f2;
  color:white;
  padding:15px;
  font-size:16px;
  outline:none;
}

button{
  border:1px solid #4deaff;
  background:#062638;
  color:#9ff6ff;
  padding:0 16px;
  min-height:52px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  background:#0a4965;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.quick button{
  min-height:42px;
  font-size:11px;
}

.info{
  text-align:center;
  font-size:12px;
  opacity:.75;
}

#clock{
  font-size:24px;
  color:#bfffff;
}

@media(max-width:600px){

  .hud{
    width:190px;
    height:190px;
  }

  .hud:after{
    inset:58px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  input{
    grid-column:1/3;
  }

  .quick{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">PERSONAL INTELLIGENCE SYSTEM</div>
</div>

<div class="hud"></div>

<div class="status">
  SYSTEM ONLINE
  <br><br>
  <span id="clock">--:--</span>
</div>

<div id="chat" class="chat"></div>

<div class="quick">
  <button onclick="runCommand('What time is it?')">TIME</button>
  <button onclick="runCommand('What is today date?')">DATE</button>
  <button onclick="runCommand('What is 42 times 19?')">MATH</button>
  <button onclick="runCommand('What is the weather?')">WEATHER</button>
</div>

<div class="controls">

<input
  id="input"
  placeholder="Ask JARVIS something..."
  autocomplete="off"
>

<button onclick="askJarvis()">ASK</button>

<button onclick="startVoice()">🎙 VOICE</button>

</div>

<div class="info">
  Try: “What time is it?”, “25 percent of 500”, “weather in Missoula”, or “system status”
</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");

function addMessage(name,text){

  const div=document.createElement("div");

  div.className="message";

  div.innerHTML=
    "<b>"+name+"</b>"+
    text;

  chat.appendChild(div);

  chat.scrollTop=chat.scrollHeight;
}

function speak(text){

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const message=new SpeechSynthesisUtterance(text);

  message.rate=.95;
  message.pitch=.82;
  message.volume=1;

  const voices=speechSynthesis.getVoices();

  const maleVoice=
    voices.find(v=>v.lang==="en-GB") ||
    voices.find(v=>v.lang==="en-US");

  if(maleVoice){
    message.voice=maleVoice;
  }

  speechSynthesis.speak(message);
}

function jarvis(text){

  addMessage("JARVIS",text);

  speak(text);
}

function updateClock(){

  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit"
    });
}

updateClock();

setInterval(updateClock,1000);

function calculate(text){

  let q=text.toLowerCase();

  let percentage=q.match(
    /(\d+(?:\.\d+)?)\s*(?:percent|%)\s+of\s+(\d+(?:\.\d+)?)/
  );

  if(percentage){

    let result=
      Number(percentage[1]) /
      100 *
      Number(percentage[2]);

    return result;
  }

  q=q
  .replace(/what is/g,"")
  .replace(/what's/g,"")
  .replace(/calculate/g,"")
  .replace(/times/g,"*")
  .replace(/multiplied by/g,"*")
  .replace(/divided by/g,"/")
  .replace(/plus/g,"+")
  .replace(/minus/g,"-")
  .replace(/\?/g,"")
  .trim();

  if(
    !/[0-9]/.test(q) ||
    !/[+\-*\/]/.test(q)
  ){
    return null;
  }

  if(
    !/^[0-9+\-*/().\s]+$/.test(q)
  ){
    return null;
  }

  try{

    const result=
      Function(
        '"use strict"; return ('+q+')'
      )();

    if(
      typeof result==="number" &&
      isFinite(result)
    ){
      return result;
    }

  }catch(e){}

  return null;
}

async function weatherForCity(city){

  try{

    jarvis(
      "Accessing weather data for "+
      city+"."
    );

    const locationRequest=
      await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name="+
        encodeURIComponent(city)+
        "&count=1&language=en&format=json"
      );

    const location=
      await locationRequest.json();

    if(
      !location.results ||
      !location.results.length
    ){
      jarvis(
        "I could not locate "+
        city+"."
      );

      return;
    }

    const place=location.results[0];

    getWeather(
      place.latitude,
      place.longitude,
      place.name
    );

  }catch(e){

    jarvis(
      "I could not access the weather service."
    );
  }
}

async function getWeather(lat,lon,name){

  try{

    const request=
      await fetch(
        "https://api.open-meteo.com/v1/forecast"+
        "?latitude="+lat+
        "&longitude="+lon+
        "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m"+
        "&temperature_unit=fahrenheit"+
        "&wind_speed_unit=mph"+
        "&timezone=auto"
      );

    const data=
      await request.json();

    const current=data.current;

    const temperature=
      Math.round(current.temperature_2m);

    const feels=
      Math.round(current.apparent_temperature);

    const wind=
      Math.round(current.wind_speed_10m);

    jarvis(
      "Current conditions in "+
      name+
      " are "+
      temperature+
      " degrees Fahrenheit. It feels like "+
      feels+
      " degrees, with wind around "+
      wind+
      " miles per hour."
    );

  }catch(e){

    jarvis(
      "Weather information is currently unavailable."
    );
  }
}

function localWeather(){

  if(!navigator.geolocation){

    jarvis(
      "Tell me a city, for example weather in Missoula."
    );

    return;
  }

  jarvis(
    "Requesting your location for local weather."
  );

  navigator.geolocation.getCurrentPosition(

    position=>{

      getWeather(
        position.coords.latitude,
        position.coords.longitude,
        "your location"
      );
    },

    error=>{

      jarvis(
        "Location permission was not granted. You can say weather in Missoula instead."
      );
    }
  );
}

function runCommand(text){

  if(!text) return;

  addMessage(
    "YOU",
    text
  );

  const command=
    text.toLowerCase().trim();

  if(
    command.includes("hello") ||
    command.includes("hey jarvis") ||
    command==="jarvis"
  ){

    jarvis(
      "At your service."
    );

    return;
  }

  if(
    command.includes("time")
  ){

    const now=
      new Date().toLocaleTimeString(
        [],
        {
          hour:"numeric",
          minute:"2-digit"
        }
      );

    jarvis(
      "The time is "+
      now+"."
    );

    return;
  }

  if(
    command.includes("date") ||
    command.includes("what day")
  ){

    const date=
      new Date().toLocaleDateString(
        [],
        {
          weekday:"long",
          month:"long",
          day:"numeric",
          year:"numeric"
        }
      );

    jarvis(
      "Today is "+
      date+"."
    );

    return;
  }

  if(
    command.includes("weather")
  ){

    const cityMatch=
      text.match(
        /weather\s+(?:in|for)\s+(.+)/i
      );

    if(cityMatch){

      weatherForCity(
        cityMatch[1]
      );

    }else{

      localWeather();
    }

    return;
  }

  if(
    command.includes("system status") ||
    command==="status"
  ){

    jarvis(
      "All primary systems are online."
    );

    return;
  }

  if(
    command.includes("clear screen") ||
    command==="clear"
  ){

    chat.innerHTML="";

    jarvis(
      "Display cleared."
    );

    return;
  }

  const math=
    calculate(text);

  if(math!==null){

    jarvis(
      "The answer is "+
      math+"."
    );

    return;
  }

  jarvis(
    "I do not have an answer programmed for that yet. My AI intelligence module will be added next."
  );
}

function askJarvis(){

  const text=
    input.value.trim();

  if(!text) return;

  input.value="";

  runCommand(text);
}

input.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      askJarvis();
    }
  }
);

function startVoice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    jarvis(
      "Voice recognition is not available in this browser. You can still type commands."
    );

    return;
  }

  const recognition=
    new SpeechRecognition();

  recognition.lang="en-US";

  recognition.interimResults=false;

  jarvis(
    "Listening."
  );

  recognition.start();

  recognition.onresult=
    event=>{

      const text=
        event.results[0][0].transcript;

      runCommand(text);
    };

  recognition.onerror=
    event=>{

      jarvis(
        "I could not hear that command."
      );
    };
}

addMessage(
  "SYSTEM",
  "JARVIS interface initialized."
);

setTimeout(
  ()=>{
    jarvis(
      "JARVIS online. Awaiting your command."
    );
  },
  700
);

</script>

</body>
</html>
