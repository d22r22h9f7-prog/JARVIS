<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>JARVIS</title>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="theme-color" content="#02090e">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          #082735 0%,
          #031219 33%,
          #01070b 70%,
          #000 100%
        );
      font-family: Arial, Helvetica, sans-serif;
      color: #aef7ff;
    }

    body {
      min-height: 100dvh;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      cursor: pointer;
    }

    .background-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(0, 210, 255, .14),
          rgba(0, 155, 210, .05) 40%,
          transparent 70%
        );
      filter: blur(15px);
      animation: backgroundPulse 4s ease-in-out infinite;
    }

    @keyframes backgroundPulse {
      0%,
      100% {
        transform: scale(.95);
        opacity: .55;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    .hud {
      position: relative;
      width: min(88vw, 520px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter:
        drop-shadow(
          0 0 20px rgba(0, 220, 255, .25)
        );
    }

    .ticks {
      position: absolute;
      inset: 0;
      border-radius: 50%;

      background:
        repeating-conic-gradient(
          from 0deg,
          rgba(88, 235, 255, .8) 0deg 1deg,
          transparent 1deg 4deg
        );

      mask:
        radial-gradient(
          circle,
          transparent 0%,
          transparent 88%,
          black 89%,
          black 95%,
          transparent 96%
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0%,
          transparent 88%,
          black 89%,
          black 95%,
          transparent 96%
        );

      opacity: .65;
      animation: spin 38s linear infinite;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border-style: solid;
      box-shadow:
        inset 0 0 18px rgba(0, 217, 255, .08),
        0 0 18px rgba(0, 217, 255, .08);
    }

    .ring1 {
      width: 92%;
      height: 92%;
      border-width: 2px;
      border-color:
        rgba(55, 222, 255, .7)
        rgba(55, 222, 255, .18)
        rgba(55, 222, 255, .7)
        rgba(55, 222, 255, .18);
      animation: spin 18s linear infinite;
    }

    .ring2 {
      width: 77%;
      height: 77%;
      border-width: 4px;
      border-color:
        rgba(0, 205, 245, .85)
        transparent
        rgba(0, 205, 245, .3)
        transparent;
      animation: reverseSpin 14s linear infinite;
    }

    .ring3 {
      width: 63%;
      height: 63%;
      border-width: 2px;
      border-color:
        rgba(119, 244, 255, .32)
        rgba(119, 244, 255, .8)
        rgba(119, 244, 255, .32)
        rgba(119, 244, 255, .8);
      animation: spin 9s linear infinite;
    }

    .ring4 {
      width: 48%;
      height: 48%;
      border-width: 5px;
      border-color:
        rgba(97, 242, 255, .85)
        rgba(97, 242, 255, .15)
        rgba(97, 242, 255, .85)
        rgba(97, 242, 255, .15);
      animation: reverseSpin 7s linear infinite;
    }

    .innerTicks {
      position: absolute;
      width: 70%;
      height: 70%;
      border-radius: 50%;

      background:
        repeating-conic-gradient(
          rgba(78, 232, 255, .75) 0deg .7deg,
          transparent .7deg 5deg
        );

      mask:
        radial-gradient(
          circle,
          transparent 0%,
          transparent 86%,
          black 87%,
          black 92%,
          transparent 93%
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 0%,
          transparent 86%,
          black 87%,
          black 92%,
          transparent 93%
        );

      opacity: .7;
      animation: reverseSpin 24s linear infinite;
    }

    .amber {
      position: absolute;
      width: 88%;
      height: 88%;
      border-radius: 50%;
      border: 4px solid transparent;
      border-left-color: rgba(255, 172, 43, .9);
      transform: rotate(25deg);
      opacity: .65;
      filter:
        drop-shadow(
          0 0 6px rgba(255, 170, 40, .5)
        );
      animation: amberMove 7s ease-in-out infinite;
    }

    @keyframes amberMove {
      0%,
      100% {
        transform: rotate(15deg);
      }

      50% {
        transform: rotate(48deg);
      }
    }

    .core {
      position: absolute;
      width: 37%;
      height: 37%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        radial-gradient(
          circle,
          rgba(0, 191, 230, .25),
          rgba(0, 74, 99, .18) 45%,
          rgba(0, 10, 15, .8) 72%
        );

      border: 1px solid rgba(123, 244, 255, .55);

      box-shadow:
        inset 0 0 32px rgba(0, 220, 255, .17),
        0 0 30px rgba(0, 220, 255, .2);

      z-index: 10;
      transition: .3s ease;
    }

    .name {
      font-size: clamp(18px, 5vw, 34px);
      font-weight: 300;
      letter-spacing: clamp(2px, 1vw, 7px);
      color: #b9faff;
      text-shadow:
        0 0 12px rgba(80, 235, 255, .7);
      margin-left: 5px;
    }

    .status {
      position: absolute;
      top: calc(50% + min(27vw, 155px));
      width: 100%;
      text-align: center;
      font-size: 13px;
      letter-spacing: 3px;
      color: rgba(150, 239, 255, .85);
      text-transform: uppercase;
    }

    .substatus {
      position: absolute;
      top: calc(50% + min(31vw, 185px));
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(125, 210, 225, .45);
      text-transform: uppercase;
    }

    .tapHint {
      position: absolute;
      bottom: calc(45px + env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(138, 231, 246, .55);
      text-transform: uppercase;
    }

    .hud.listening .core {
      transform: scale(1.08);

      box-shadow:
        inset 0 0 50px rgba(0, 225, 255, .35),
        0 0 55px rgba(0, 225, 255, .5);
    }

    .hud.listening .ring2 {
      animation-duration: 3s;
    }

    .hud.listening .ring3 {
      animation-duration: 2.2s;
    }

    .hud.thinking .core {
      animation: corePulse .75s ease-in-out infinite;
    }

    .hud.thinking .ring1 {
      animation-duration: 4s;
    }

    .hud.thinking .ring2 {
      animation-duration: 2.5s;
    }

    .hud.speaking .core {
      animation: speakingPulse .48s ease-in-out infinite;
    }

    .hud.speaking .ring4 {
      animation-duration: 1.8s;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes reverseSpin {
      from {
        transform: rotate(360deg);
      }

      to {
        transform: rotate(0deg);
      }
    }

    @keyframes corePulse {
      0%,
      100% {
        transform: scale(.98);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes speakingPulse {
      0%,
      100% {
        transform: scale(1);
        opacity: .88;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @media (max-width: 420px) {
      .hud {
        width: 92vw;
      }

      .name {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">

    <div class="background-glow"></div>

    <div class="hud" id="hud">

      <div class="ticks"></div>

      <div class="amber"></div>

      <div class="ring ring1"></div>

      <div class="ring ring2"></div>

      <div class="innerTicks"></div>

      <div class="ring ring3"></div>

      <div class="ring ring4"></div>

      <div class="core">
        <div class="name">
          J.A.R.V.I.S.
        </div>
      </div>

    </div>

    <div class="status" id="status">
      TAP TO SPEAK
    </div>

    <div class="substatus" id="substatus">
      VOICE SYSTEM READY
    </div>

    <div class="tapHint">
      TAP ANYWHERE
    </div>

  </div>


<script>

const app =
  document.getElementById("app");

const hud =
  document.getElementById("hud");

const statusText =
  document.getElementById("status");

const substatus =
  document.getElementById("substatus");


let recognition = null;

let listening = false;

let speaking = false;

let processing = false;

let selectedVoice = null;

let currentUtterance = null;


/* ========================= */
/* FIND VOICE */
/* ========================= */

function findVoice() {

  const voices =
    window.speechSynthesis
      ? speechSynthesis.getVoices()
      : [];


  selectedVoice =

    voices.find(
      v =>
        /Daniel/i.test(v.name)
    )

    ||

    voices.find(
      v =>
        /Arthur/i.test(v.name)
    )

    ||

    voices.find(
      v =>
        /Oliver/i.test(v.name)
    )

    ||

    voices.find(
      v =>
        v.lang === "en-GB"
    )

    ||

    voices.find(
      v =>
        v.lang &&
        v.lang.startsWith("en")
    )

    ||

    null;

}


if ("speechSynthesis" in window) {

  speechSynthesis.onvoiceschanged =
    findVoice;

  findVoice();

}


/* ========================= */
/* ADD SIR */
/* ========================= */

function addSir(text) {

  if (!text) {
    return "Yes, sir.";
  }

  let cleaned =
    String(text)
      .trim()
      .replace(/\s+/g, " ");

  if (
    /\bsir[.!?]*$/i.test(cleaned)
  ) {
    return cleaned;
  }

  cleaned =
    cleaned.replace(
      /[.!?]+$/,
      ""
    );

  return cleaned + ", sir.";

}


/* ========================= */
/* RESET SCREEN */
/* ========================= */

function readyState() {

  listening = false;
  speaking = false;
  processing = false;

  hud.classList.remove(
    "listening",
    "thinking",
    "speaking"
  );

  statusText.textContent =
    "TAP TO SPEAK";

  substatus.textContent =
    "VOICE SYSTEM READY";

}


/* ========================= */
/* SPEAK */
/* ========================= */

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    readyState();

    statusText.textContent =
      "VOICE OUTPUT UNAVAILABLE";

    return;
  }


  speaking = true;

  hud.classList.remove(
    "listening",
    "thinking"
  );

  hud.classList.add(
    "speaking"
  );

  statusText.textContent =
    "VOICE OUTPUT";

  substatus.textContent =
    "PREPARING RESPONSE";


  try {
    speechSynthesis.cancel();
  }
  catch (e) {}


  const spokenText =
    addSir(text);


  /*
  IMPORTANT:
  Wait for microphone / speech recognition
  to fully release before starting speech.
  */

  setTimeout(() => {

    currentUtterance =
      new SpeechSynthesisUtterance(
        spokenText
      );


    findVoice();


    if (selectedVoice) {

      currentUtterance.voice =
        selectedVoice;

      currentUtterance.lang =
        selectedVoice.lang || "en-GB";

    }
    else {

      currentUtterance.lang =
        "en-GB";

    }


    currentUtterance.rate =
      0.86;

    currentUtterance.pitch =
      0.88;

    currentUtterance.volume =
      1;


    currentUtterance.onstart =
      () => {

        speaking = true;

        statusText.textContent =
          "SPEAKING";

        substatus.textContent =
          "VOICE OUTPUT ACTIVE";

      };


    currentUtterance.onend =
      () => {

        currentUtterance = null;

        readyState();

      };


    currentUtterance.onerror =
      event => {

        console.log(
          "Speech output error:",
          event
        );

        currentUtterance = null;

        readyState();

      };


    try {

      /*
      Safari can occasionally leave synthesis paused.
      */

      if (speechSynthesis.paused) {
        speechSynthesis.resume();
      }

      speechSynthesis.speak(
        currentUtterance
      );

    }

    catch (error) {

      console.log(
        "Speech error:",
        error
      );

      currentUtterance = null;

      readyState();

    }

  }, 550);

}


/* ========================= */
/* THINKING */
/* ========================= */

function thinkingOn() {

  processing = true;

  hud.classList.remove(
    "listening",
    "speaking"
  );

  hud.classList.add(
    "thinking"
  );

  statusText.textContent =
    "THINKING";

  substatus.textContent =
    "PROCESSING REQUEST";

}


function thinkingOff() {

  processing = false;

  hud.classList.remove(
    "thinking"
  );

}


/* ========================= */
/* ASK AI */
/* ========================= */

async function askAI(message) {

  thinkingOn();

  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: message
            })
        }
      );


    const data =
      await response.json();


    thinkingOff();


    if (!response.ok) {

      console.log(data);

      speak(
        "I encountered a problem connecting to my intelligence system"
      );

      return;

    }


    if (!data.reply) {

      speak(
        "I did not receive a useful response"
      );

      return;

    }


    /*
    SHORT PAUSE BEFORE SPEAKING
    */

    setTimeout(
      () => speak(data.reply),
      200
    );

  }

  catch (error) {

    console.log(error);

    thinkingOff();

    speak(
      "I am unable to reach my intelligence system at the moment"
    );

  }

}


/* ========================= */
/* TIME */
/* ========================= */

function tellTime() {

  const now =
    new Date();

  const time =
    now.toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  speak(
    `The time is ${time}`
  );

}


/* ========================= */
/* DATE */
/* ========================= */

function tellDate() {

  const now =
    new Date();

  const date =
    now.toLocaleDateString(
      [],
      {
        weekday: "long",
        month: "long",
        day: "numeric"
      }
    );

  speak(
    `Today is ${date}`
  );

}


/* ========================= */
/* WEATHER */
/* ========================= */

async function weatherByCity(city) {

  thinkingOn();

  try {

    const geo =
      await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name="
        +
        encodeURIComponent(city)
        +
        "&count=1&language=en&format=json"
      );


    const geoData =
      await geo.json();


    if (
      !geoData.results ||
      !geoData.results.length
    ) {

      thinkingOff();

      speak(
        `I couldn't locate ${city}`
      );

      return;

    }


    const place =
      geoData.results[0];


    const weather =
      await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,apparent_temperature,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`
      );


    const weatherData =
      await weather.json();


    thinkingOff();


    const current =
      weatherData.current;


    if (!current) {

      speak(
        "I couldn't retrieve the current weather"
      );

      return;

    }


    const temp =
      Math.round(
        current.temperature_2m
      );


    const feels =
      Math.round(
        current.apparent_temperature
      );


    const wind =
      Math.round(
        current.wind_speed_10m
      );


    speak(
      `It is currently ${temp} degrees in ${place.name}, feels like ${feels}, with winds around ${wind} miles per hour`
    );

  }

  catch (error) {

    console.log(error);

    thinkingOff();

    speak(
      "I couldn't retrieve the weather"
    );

  }

}


/* ========================= */
/* PROCESS COMMAND */
/* ========================= */

function processCommand(input) {

  const text =
    input.trim();


  if (!text) {

    readyState();

    return;

  }


  const lower =
    text.toLowerCase();


  if (
    lower === "hello"
    ||
    lower === "hi"
    ||
    lower === "hey"
    ||
    lower.includes("hello jarvis")
  ) {

    speak(
      "Good evening. How may I assist you"
    );

    return;

  }


  if (
    lower.includes("what time")
    ||
    lower === "time"
    ||
    lower.includes("current time")
  ) {

    tellTime();

    return;

  }


  if (
    lower.includes("what day")
    ||
    lower.includes("what date")
    ||
    lower === "date"
  ) {

    tellDate();

    return;

  }


  if (
    lower.includes("system status")
    ||
    lower.includes("status report")
  ) {

    speak(
      "All primary systems are online and functioning normally"
    );

    return;

  }


  if (
    lower.includes("thank you")
    ||
    lower.includes("thanks")
  ) {

    speak(
      "Always a pleasure"
    );

    return;

  }


  if (
    lower.includes("weather")
  ) {

    let city =
      text
        .replace(
          /what('?s| is)? the weather( like)?/i,
          ""
        )
        .replace(
          /weather/i,
          ""
        )
        .replace(
          /\bin\b/i,
          ""
        )
        .replace(
          /\bfor\b/i,
          ""
        )
        .trim();


    if (!city) {
      city = "Missoula";
    }


    weatherByCity(city);

    return;

  }


  askAI(text);

}


/* ========================= */
/* SETUP RECOGNITION */
/* ========================= */

function setupRecognition() {

  const Recognition =
    window.SpeechRecognition
    ||
    window.webkitSpeechRecognition;


  if (!Recognition) {

    statusText.textContent =
      "VOICE NOT SUPPORTED";

    substatus.textContent =
      "OPEN IN SAFARI";

    return;

  }


  recognition =
    new Recognition();


  recognition.lang =
    "en-US";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;

      hud.classList.add(
        "listening"
      );

      statusText.textContent =
        "LISTENING";

      substatus.textContent =
        "SPEAK NOW";

    };


  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;


      statusText.textContent =
        "COMMAND RECEIVED";

      substatus.textContent =
        transcript;


      /*
      IMPORTANT:
      Stop recognition first,
      then process after onend.
      */

      recognition._pendingTranscript =
        transcript;


      try {
        recognition.stop();
      }
      catch (e) {}

    };


  recognition.onerror =
    event => {

      console.log(
        "Speech recognition error:",
        event.error
      );


      listening = false;


      hud.classList.remove(
        "listening"
      );


      if (
        event.error ===
        "not-allowed"
      ) {

        statusText.textContent =
          "MICROPHONE BLOCKED";

        substatus.textContent =
          "ALLOW MICROPHONE ACCESS";

        return;

      }


      readyState();

    };


  recognition.onend =
    () => {

      listening = false;

      hud.classList.remove(
        "listening"
      );


      const transcript =
        recognition._pendingTranscript;


      recognition._pendingTranscript =
        null;


      if (transcript) {

        /*
        Give iPhone time to release
        microphone audio before TTS.
        */

        setTimeout(
          () => processCommand(transcript),
          450
        );

      }
      else if (
        !speaking &&
        !processing
      ) {

        readyState();

      }

    };

}


/* ========================= */
/* START LISTENING */
/* ========================= */

function listen() {

  if (
    listening ||
    speaking ||
    processing
  ) {
    return;
  }


  /*
  Cancel old speech first
  */

  try {
    speechSynthesis.cancel();
  }
  catch (e) {}


  if (!recognition) {
    setupRecognition();
  }


  if (!recognition) {
    return;
  }


  statusText.textContent =
    "STARTING MICROPHONE";

  substatus.textContent =
    "PLEASE WAIT";


  try {

    recognition.start();

  }

  catch (error) {

    console.log(
      "Recognition start error:",
      error
    );

    readyState();

  }

}


/* ========================= */
/* TAP ANYWHERE */
/* ========================= */

app.addEventListener(
  "click",
  listen
);


/* ========================= */
/* RESET WHEN RETURNING */
/* ========================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      readyState();

      try {

        if (
          speechSynthesis.paused
        ) {
          speechSynthesis.resume();
        }

      }
      catch (e) {}

    }

  }
);


window.addEventListener(
  "pageshow",
  () => {

    readyState();

    findVoice();

  }
);

</script>

</body>
</html>
