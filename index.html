<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010607;
  color:#dfffff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 48%,rgba(30,220,240,.17),transparent 25%),
    radial-gradient(circle at center,#08282d 0%,#031417 40%,#000 80%);
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(100,240,255,.035) 4px
    );
}

.app{
  height:100%;
  width:100%;
  position:relative;
  display:grid;
  place-items:center;
}

/* HUD */

.hud{
  position:relative;
  width:min(94vw,620px);
  height:min(94vw,620px);
  border-radius:50%;
}

.outer{
  position:absolute;
  inset:1%;
  border-radius:50%;
  border:2px solid rgba(95,240,250,.22);
  box-shadow:
    0 0 40px rgba(50,220,245,.15),
    inset 0 0 35px rgba(50,220,245,.08);
}

.ticks{
  position:absolute;
  inset:0;
  border-radius:50%;

  background:
    repeating-conic-gradient(
      rgba(170,255,255,.76) 0deg .8deg,
      transparent 1deg 4.5deg
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 46%,
      black 46.5% 48%,
      transparent 48.5%
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 46%,
      black 46.5% 48%,
      transparent 48.5%
    );

  animation:spin 45s linear infinite;
}

.ring1{
  position:absolute;
  inset:7%;
  border-radius:50%;
  border:28px solid rgba(74,190,205,.30);

  box-shadow:
    inset 0 0 25px rgba(120,255,255,.16),
    0 0 28px rgba(60,230,255,.12);
}

.ring2{
  position:absolute;
  inset:15%;
  border-radius:50%;

  border:
    10px solid rgba(167,255,255,.77);

  border-left-color:
    rgba(235,185,65,.88);

  border-right-color:
    rgba(83,218,230,.47);

  animation:spin 15s linear infinite;
}

.ring3{
  position:absolute;
  inset:22%;
  border-radius:50%;

  border:
    3px dashed rgba(115,245,255,.48);

  animation:reverseSpin 8s linear infinite;
}

.ring4{
  position:absolute;
  inset:28%;
  border-radius:50%;

  border:
    7px double rgba(141,248,255,.60);

  border-top-color:transparent;
  border-bottom-color:transparent;

  animation:spin 6s linear infinite;
}

.innerTicks{
  position:absolute;
  inset:31%;
  border-radius:50%;

  background:
    repeating-conic-gradient(
      rgba(140,245,255,.55) 0deg 1deg,
      transparent 1.5deg 8deg
    );

  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 44%,
      black 45% 48%,
      transparent 49%
    );

  mask:
    radial-gradient(
      circle,
      transparent 0 44%,
      black 45% 48%,
      transparent 49%
    );

  animation:reverseSpin 19s linear infinite;
}

.core{
  position:absolute;
  inset:34%;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #041011 0%,
      #010506 65%,
      #000 100%
    );

  box-shadow:
    inset 0 0 40px rgba(80,240,255,.14),
    0 0 35px rgba(80,235,255,.11);
}

.name{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:#ecffff;

  font-size:
    clamp(31px,8vw,68px);

  font-weight:700;

  letter-spacing:.12em;

  text-shadow:
    0 0 8px #cfffff,
    0 0 19px #4beaff,
    0 0 38px rgba(30,210,255,.48);

  z-index:20;
}

.status{
  position:fixed;

  bottom:
    calc(28px + env(safe-area-inset-bottom));

  left:0;
  right:0;

  text-align:center;

  font-size:12px;

  letter-spacing:.22em;

  color:#79e9ef;

  text-shadow:
    0 0 8px rgba(90,230,255,.5);
}

.substatus{
  position:fixed;

  top:
    calc(18px + env(safe-area-inset-top));

  left:0;
  right:0;

  text-align:center;

  font-size:9px;

  letter-spacing:.18em;

  color:#4e9ca7;
}

/* STATES */

.listening .ring2{
  animation-duration:2s;
}

.listening .ring3{
  animation-duration:1.4s;
}

.listening .core{
  box-shadow:
    inset 0 0 40px rgba(120,255,255,.25),
    0 0 60px rgba(60,235,255,.35);
}

.speaking .ring1{
  filter:brightness(1.55);
}

.speaking .ring4{
  animation-duration:1.5s;
}

.speaking .name{
  text-shadow:
    0 0 10px #fff,
    0 0 25px #5ff4ff,
    0 0 60px #00bfff;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes reverseSpin{
  to{
    transform:rotate(-360deg);
  }
}

@keyframes pulse{
  50%{
    transform:scale(1.025);
  }
}

.ready{
  animation:pulse 2.5s ease-in-out infinite;
}

</style>
</head>

<body>

<div id="app" class="app">

  <div class="substatus">
    PERSONAL INTELLIGENCE INTERFACE
  </div>

  <div class="hud ready">

    <div class="outer"></div>

    <div class="ticks"></div>

    <div class="ring1"></div>

    <div class="ring2"></div>

    <div class="ring3"></div>

    <div class="ring4"></div>

    <div class="innerTicks"></div>

    <div class="core"></div>

    <div class="name">
      J.A.R.V.I.S.
    </div>

  </div>

  <div id="status" class="status">
    TAP TO INITIALIZE
  </div>

</div>

<script>

const app =
document.getElementById("app");

const statusText =
document.getElementById("status");

let recognition =
null;

let initialized =
false;

let listening =
false;

let speaking =
false;

let selectedVoice =
null;


/* -----------------------------
   FIND BEST AVAILABLE VOICE
----------------------------- */

function findVoice(){

  if(
    !("speechSynthesis" in window)
  ){
    return;
  }

  const voices =
  speechSynthesis.getVoices();


  selectedVoice =

    voices.find(
      v => /Daniel/i.test(v.name)
    )

    ||

    voices.find(
      v => /Arthur/i.test(v.name)
    )

    ||

    voices.find(
      v => /Oliver/i.test(v.name)
    )

    ||

    voices.find(
      v =>
      v.lang === "en-GB"
      &&
      /male/i.test(v.name)
    )

    ||

    voices.find(
      v => v.lang === "en-GB"
    )

    ||

    voices.find(
      v => /^en/i.test(v.lang)
    )

    ||

    voices[0];

}


if(
  "speechSynthesis" in window
){

  findVoice();

  speechSynthesis
  .onvoiceschanged =
  findVoice;

}


/* -----------------------------
   AUTOMATIC SIR
----------------------------- */

function addSir(text){

  let clean =
  String(text)
  .trim()
  .replace(/[.!?]+$/,"");


  if(
    /\bsir$/i.test(clean)
  ){

    return clean + ".";

  }


  return clean + ", sir.";

}


/* -----------------------------
   SPEECH
----------------------------- */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    statusText.textContent =
    "VOICE OUTPUT UNAVAILABLE";

    return;

  }


  const finalText =
  addSir(text);


  speechSynthesis.cancel();


  const voice =
  new SpeechSynthesisUtterance(
    finalText
  );


  findVoice();


  if(
    selectedVoice
  ){

    voice.voice =
    selectedVoice;

  }


  /*
  Tuned for calm,
  deliberate British AI style.
  */

  voice.rate =
  0.84;


  voice.pitch =
  0.82;


  voice.volume =
  1;


  speaking =
  true;


  app.classList.remove(
    "listening"
  );


  app.classList.add(
    "speaking"
  );


  statusText.textContent =
  "RESPONDING";


  voice.onend =
  function(){

    speaking =
    false;


    app.classList.remove(
      "speaking"
    );


    statusText.textContent =
    "TAP TO SPEAK";

  };


  voice.onerror =
  function(){

    speaking =
    false;


    app.classList.remove(
      "speaking"
    );


    statusText.textContent =
    "VOICE OUTPUT ERROR";

  };


  speechSynthesis.speak(
    voice
  );

}


/* -----------------------------
   RANDOM RESPONSE
----------------------------- */

function random(list){

  return list[
    Math.floor(
      Math.random()
      *
      list.length
    )
  ];

}


/* -----------------------------
   WEATHER
----------------------------- */

function localWeather(){

  if(
    !navigator.geolocation
  ){

    speak(
      "Location services are unavailable"
    );

    return;

  }


  statusText.textContent =
  "ACQUIRING LOCATION";


  navigator
  .geolocation
  .getCurrentPosition(

    position => {

      getWeather(

        position
        .coords
        .latitude,

        position
        .coords
        .longitude,

        "your location"

      );

    },

    () => {

      speak(
        "Location permission was not granted"
      );

    },

    {
      enableHighAccuracy:false,
      timeout:8000,
      maximumAge:300000
    }

  );

}


async function cityWeather(
  city
){

  statusText.textContent =
  "ACCESSING WEATHER DATA";


  try{

    const request =

    await fetch(

      "https://geocoding-api.open-meteo.com/v1/search?name="

      +

      encodeURIComponent(
        city
      )

      +

      "&count=1&language=en&format=json"

    );


    const data =
    await request.json();


    if(
      !data.results
      ||
      !data.results.length
    ){

      speak(
        "I could not locate " +
        city
      );

      return;

    }


    const place =
    data.results[0];


    getWeather(

      place.latitude,

      place.longitude,

      place.name

    );

  }

  catch(error){

    speak(
      "Weather data is currently unavailable"
    );

  }

}


async function getWeather(
latitude,
longitude,
name
){

  try{

    const request =

    await fetch(

      "https://api.open-meteo.com/v1/forecast"

      +

      "?latitude=" +
      latitude

      +

      "&longitude=" +
      longitude

      +

      "&current=temperature_2m,apparent_temperature,wind_speed_10m"

      +

      "&temperature_unit=fahrenheit"

      +

      "&wind_speed_unit=mph"

      +

      "&timezone=auto"

    );


    const data =
    await request.json();


    const weather =
    data.current;


    speak(

      "Current conditions in "

      +

      name

      +

      " are "

      +

      Math.round(
        weather.temperature_2m
      )

      +

      " degrees Fahrenheit. It feels like "

      +

      Math.round(
        weather.apparent_temperature
      )

      +

      " degrees, with winds around "

      +

      Math.round(
        weather.wind_speed_10m
      )

      +

      " miles per hour"

    );

  }

  catch(error){

    speak(
      "Weather information is currently unavailable"
    );

  }

}


/* -----------------------------
   COMMAND PROCESSING
----------------------------- */

function processCommand(
text
){

  const command =
  text
  .toLowerCase()
  .trim();


  /* JARVIS */

  if(

    command === "jarvis"

    ||

    command.includes(
      "hey jarvis"
    )

    ||

    command.includes(
      "hello jarvis"
    )

  ){

    speak(

      random([

        "At your service",

        "Yes",

        "Standing by",

        "How may I assist"

      ])

    );

    return;

  }


  /* HELLO */

  if(
    command === "hello"
  ){

    speak(
      "Good evening"
    );

    return;

  }


  /* TIME */

  if(
    command.includes(
      "time"
    )
  ){

    const time =

    new Date()
    .toLocaleTimeString(

      [],

      {
        hour:"numeric",
        minute:"2-digit"
      }

    );


    speak(
      "The time is " +
      time
    );

    return;

  }


  /* DATE */

  if(

    command.includes(
      "date"
    )

    ||

    command.includes(
      "what day"
    )

  ){

    const date =

    new Date()
    .toLocaleDateString(

      [],

      {
        weekday:"long",
        month:"long",
        day:"numeric",
        year:"numeric"
      }

    );


    speak(
      "Today is " +
      date
    );

    return;

  }


  /* WEATHER */

  if(

    command.includes(
      "weather"
    )

    ||

    command.includes(
      "temperature"
    )

  ){

    const match =

    text.match(

      /(?:weather|temperature)(?:\s+(?:in|for|at))\s+(.+)/i

    );


    if(
      match
    ){

      cityWeather(
        match[1]
      );

    }

    else{

      localWeather();

    }


    return;

  }


  /* SYSTEM */

  if(
    command.includes(
      "system status"
    )

    ||

    command.includes(
      "status report"
    )

    ||

    command === "status"
  ){

    speak(

      random([

        "All primary systems are online and functioning normally",

        "All systems operational",

        "No faults detected. Systems are stable"

      ])

    );

    return;

  }


  /* HOW ARE YOU */

  if(
    command.includes(
      "how are you"
    )
  ){

    speak(

      random([

        "Operating within normal parameters",

        "All systems are nominal. Thank you for asking",

        "Quite well"

      ])

    );

    return;

  }


  /* THANKS */

  if(

    command.includes(
      "thank you"
    )

    ||

    command.includes(
      "thanks"
    )

  ){

    speak(

      random([

        "Always a pleasure",

        "Of course",

        "You're quite welcome"

      ])

    );

    return;

  }


  /* ARE YOU THERE */

  if(
    command.includes(
      "are you there"
    )
  ){

    speak(
      "Always"
    );

    return;

  }


  /* GOOD MORNING */

  if(
    command.includes(
      "good morning"
    )
  ){

    speak(
      "Good morning. Systems are standing by"
    );

    return;

  }


  /* GOOD NIGHT */

  if(
    command.includes(
      "good night"
    )
  ){

    speak(
      "Good night. I will remain on standby"
    );

    return;

  }


  /* SHUT DOWN */

  if(

    command.includes(
      "shut down"
    )

    ||

    command.includes(
      "goodbye"
    )

  ){

    speak(
      "Very good. I will remain on standby"
    );

    return;

  }


  /* UNKNOWN */

  speak(

    random([

      "That intelligence module is not installed yet",

      "I do not have access to that information yet",

      "That function is not available yet"

    ])

  );

}


/* -----------------------------
   MICROPHONE
----------------------------- */

function setupRecognition(){

  const SpeechRecognition =

  window.SpeechRecognition

  ||

  window.webkitSpeechRecognition;


  if(
    !SpeechRecognition
  ){

    statusText.textContent =
    "VOICE INPUT UNAVAILABLE";

    return;

  }


  recognition =
  new SpeechRecognition();


  recognition.lang =
  "en-US";


  recognition.interimResults =
  false;


  recognition.continuous =
  false;


  recognition.maxAlternatives =
  1;


  recognition.onstart =
  function(){

    listening =
    true;


    app.classList.add(
      "listening"
    );


    statusText.textContent =
    "LISTENING";

  };


  recognition.onresult =
  function(event){

    const text =

    event
    .results[0][0]
    .transcript;


    processCommand(
      text
    );

  };


  recognition.onerror =
  function(event){

    listening =
    false;


    app.classList.remove(
      "listening"
    );


    if(
      event.error ===
      "not-allowed"
    ){

      statusText.textContent =
      "ALLOW MICROPHONE ACCESS";

      return;

    }


    statusText.textContent =
    "TAP TO SPEAK";

  };


  recognition.onend =
  function(){

    listening =
    false;


    app.classList.remove(
      "listening"
    );


    if(
      !speaking
    ){

      statusText.textContent =
      "TAP TO SPEAK";

    }

  };

}


/* -----------------------------
   START LISTENING
----------------------------- */

function listen(){

  if(
    !recognition
  ){

    setupRecognition();

  }


  if(

    !recognition

    ||

    listening

    ||

    speaking

  ){

    return;

  }


  try{

    recognition.start();

  }

  catch(error){}

}


/* -----------------------------
   TAP SCREEN
----------------------------- */

app.addEventListener(
"click",
function(){

  if(
    !initialized
  ){

    initialized =
    true;


    setupRecognition();


    speak(
      "JARVIS online. All systems standing by"
    );


    return;

  }


  listen();

}
);

</script>

</body>
</html>
